name: Build
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libjson-glib-dev libcurl4-openssl-dev libsecret-1-dev libsodium-dev
      - name: Test and build
        run: make test && make
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Remmina and plugin
        run: ./build-install.sh --build-remmina
